<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0b060"/>
      <stop offset="100%" stop-color="#c87838"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#525252"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="220" fill="url(#sky)"/>

  <!-- Horizon haze -->
  <rect x="0" y="30" width="400" height="14" fill="white" opacity="0.06"/>

  <!-- Far cobblestone lane -->
  <rect x="0" y="42" width="400" height="40" fill="#9A7858"/>
  <!-- Cobblestone tiles, small = far away -->
  <rect x="3"   y="46" width="36" height="29" rx="2" fill="#896848" opacity="0.55"/>
  <rect x="43"  y="46" width="36" height="29" rx="2" fill="#AC8868" opacity="0.45"/>
  <rect x="83"  y="46" width="36" height="29" rx="2" fill="#896848" opacity="0.55"/>
  <rect x="123" y="46" width="36" height="29" rx="2" fill="#AC8868" opacity="0.45"/>
  <rect x="163" y="46" width="36" height="29" rx="2" fill="#896848" opacity="0.55"/>
  <rect x="203" y="46" width="36" height="29" rx="2" fill="#AC8868" opacity="0.45"/>
  <rect x="243" y="46" width="36" height="29" rx="2" fill="#896848" opacity="0.55"/>
  <rect x="283" y="46" width="36" height="29" rx="2" fill="#AC8868" opacity="0.45"/>
  <rect x="323" y="46" width="36" height="29" rx="2" fill="#896848" opacity="0.55"/>
  <rect x="363" y="46" width="37" height="29" rx="2" fill="#AC8868" opacity="0.45"/>
  <!-- Grout lines -->
  <rect x="0" y="42" width="400" height="1" fill="#7A5838" opacity="0.4"/>
  <rect x="0" y="82" width="400" height="1" fill="#7A5838" opacity="0.4"/>

  <!-- Road lane -->
  <rect x="0" y="84" width="400" height="52" fill="url(#road)"/>
  <!-- Edge markings -->
  <rect x="0" y="84"  width="400" height="2" fill="#FFD54F" opacity="0.55"/>
  <rect x="0" y="134" width="400" height="2" fill="#FFD54F" opacity="0.55"/>
  <!-- Center dashes -->
  <rect x="5"   y="108" width="44" height="4" rx="2" fill="white" opacity="0.45"/>
  <rect x="63"  y="108" width="44" height="4" rx="2" fill="white" opacity="0.45"/>
  <rect x="121" y="108" width="44" height="4" rx="2" fill="white" opacity="0.45"/>
  <rect x="179" y="108" width="44" height="4" rx="2" fill="white" opacity="0.45"/>
  <rect x="237" y="108" width="44" height="4" rx="2" fill="white" opacity="0.45"/>
  <rect x="295" y="108" width="44" height="4" rx="2" fill="white" opacity="0.45"/>
  <rect x="353" y="108" width="44" height="4" rx="2" fill="white" opacity="0.45"/>

  <!-- Car (going right) -->
  <!-- Shadow -->
  <ellipse cx="266" cy="138" rx="56" ry="6" fill="#000" opacity="0.13"/>
  <!-- Body -->
  <rect x="210" y="93" width="112" height="38" rx="5" fill="#E53935"/>
  <!-- Cabin -->
  <rect x="231" y="74" width="68" height="23" rx="5" fill="#C62828"/>
  <!-- Windshield (front = right) -->
  <rect x="278" y="77" width="17" height="18" rx="3" fill="#90CAF9" opacity="0.92"/>
  <!-- Rear window -->
  <rect x="235" y="77" width="39" height="18" rx="3" fill="#90CAF9" opacity="0.78"/>
  <!-- Door trim -->
  <rect x="212" y="105" width="108" height="2" fill="#B71C1C" opacity="0.5"/>
  <!-- Headlights -->
  <rect x="320" y="99"  width="4" height="8" rx="2" fill="#FFF9C4" opacity="0.95"/>
  <rect x="320" y="112" width="4" height="7" rx="2" fill="#FFCC02" opacity="0.85"/>
  <!-- Tail lights -->
  <rect x="213" y="99"  width="4" height="8" rx="2" fill="#FF6F00" opacity="0.8"/>
  <!-- Wheels -->
  <circle cx="234" cy="133" r="13" fill="#1a1a1a"/>
  <circle cx="308" cy="133" r="13" fill="#1a1a1a"/>
  <circle cx="234" cy="133" r="5" fill="#555"/>
  <circle cx="308" cy="133" r="5" fill="#555"/>
  <!-- Wheel shine -->
  <circle cx="231" cy="130" r="2" fill="white" opacity="0.2"/>
  <circle cx="305" cy="130" r="2" fill="white" opacity="0.2"/>

  <!-- Near cobblestone lane (wide, close) -->
  <rect x="0" y="138" width="400" height="82" fill="#A88060"/>
  <!-- Row 1 -->
  <rect x="3"   y="143" width="56" height="40" rx="3" fill="#907050" opacity="0.52"/>
  <rect x="63"  y="143" width="56" height="40" rx="3" fill="#C0A078" opacity="0.42"/>
  <rect x="123" y="143" width="56" height="40" rx="3" fill="#907050" opacity="0.52"/>
  <rect x="183" y="143" width="56" height="40" rx="3" fill="#C0A078" opacity="0.42"/>
  <rect x="243" y="143" width="56" height="40" rx="3" fill="#907050" opacity="0.52"/>
  <rect x="303" y="143" width="97" height="40" rx="3" fill="#C0A078" opacity="0.42"/>
  <!-- Row 2 (offset for brick feel) -->
  <rect x="3"   y="187" width="32" height="35" rx="3" fill="#C0A078" opacity="0.38"/>
  <rect x="39"  y="187" width="56" height="35" rx="3" fill="#907050" opacity="0.48"/>
  <rect x="99"  y="187" width="56" height="35" rx="3" fill="#C0A078" opacity="0.38"/>
  <rect x="159" y="187" width="56" height="35" rx="3" fill="#907050" opacity="0.48"/>
  <rect x="219" y="187" width="56" height="35" rx="3" fill="#C0A078" opacity="0.38"/>
  <rect x="279" y="187" width="56" height="35" rx="3" fill="#907050" opacity="0.48"/>
  <rect x="339" y="187" width="61" height="35" rx="3" fill="#C0A078" opacity="0.38"/>
  <!-- Grout -->
  <rect x="0" y="138" width="400" height="1" fill="#7A5838" opacity="0.4"/>

  <!-- ======= Beer Crate Character ======= -->
  <!-- Shadow -->
  <ellipse cx="120" cy="218" rx="65" ry="7" fill="#000" opacity="0.14"/>

  <!-- Right side face (dark, suggesting depth) -->
  <polygon points="183,168 208,148 208,200 183,220" fill="#5C3317"/>

  <!-- Front face -->
  <rect x="57" y="168" width="126" height="52" rx="3" fill="#8B5E3C"/>

  <!-- Horizontal slats -->
  <rect x="57" y="185" width="126" height="3" fill="#6B4523" opacity="0.9"/>
  <rect x="57" y="203" width="126" height="3" fill="#6B4523" opacity="0.9"/>

  <!-- Vertical slats -->
  <rect x="99"  y="168" width="3" height="52" fill="#6B4523" opacity="0.9"/>
  <rect x="141" y="168" width="3" height="52" fill="#6B4523" opacity="0.9"/>

  <!-- Left edge highlight -->
  <rect x="57" y="168" width="3" height="52" fill="white" opacity="0.07"/>

  <!-- Bottle bodies drawn BEFORE top face so the top face covers their bases,
       making the bottles look seated inside the crate rather than floating -->
  <rect x="92"  y="124" width="14" height="44" rx="6" fill="#388E3C"/>
  <rect x="114" y="124" width="14" height="44" rx="6" fill="#2E7D32"/>
  <rect x="136" y="124" width="14" height="44" rx="6" fill="#388E3C"/>
  <rect x="158" y="124" width="14" height="44" rx="6" fill="#2E7D32"/>

  <!-- Top face drawn OVER bottle bases — the 20px of bottle below y=148 is hidden,
       so each bottle appears embedded in the crate opening -->
  <polygon points="57,168 183,168 208,148 82,148" fill="#B07848"/>
  <!-- Plank lines on top face -->
  <line x1="71"  y1="148" x2="97"  y2="168" stroke="#9A6838" stroke-width="1.5" opacity="0.5"/>
  <line x1="109" y1="148" x2="135" y2="168" stroke="#9A6838" stroke-width="1.5" opacity="0.5"/>
  <line x1="147" y1="148" x2="173" y2="168" stroke="#9A6838" stroke-width="1.5" opacity="0.5"/>

  <!-- Bottle caps — drawn after top face, visible above the crate rim -->
  <rect x="93"  y="117" width="12" height="8" rx="3" fill="#FFC107"/>
  <rect x="115" y="117" width="12" height="8" rx="3" fill="#FFC107"/>
  <rect x="137" y="117" width="12" height="8" rx="3" fill="#FFC107"/>
  <rect x="159" y="117" width="12" height="8" rx="3" fill="#FFC107"/>

  <!-- Bottle glints on visible neck -->
  <rect x="94"  y="126" width="3" height="14" rx="1" fill="white" opacity="0.28"/>
  <rect x="116" y="126" width="3" height="14" rx="1" fill="white" opacity="0.28"/>
  <rect x="138" y="126" width="3" height="14" rx="1" fill="white" opacity="0.28"/>
  <rect x="160" y="126" width="3" height="14" rx="1" fill="white" opacity="0.28"/>
</svg>
